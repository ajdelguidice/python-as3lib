[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "as3lib"
authors = [{name = "ajdelguidice", email = "ajdelguidice@gmail.com"}]
description = "Partial implementation of ActionScript3 in Python"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT AND (Apache-2.0 OR MIT)"
license-files = ["LICENSE", "otherlicenses/LICENSE-ruffle.md"]
keywords = ["actionscript", "air", "flash", "flashplayer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Topic :: Utilities"
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "tkhtmlview",
    "Pillow",
    "as3lib-miniAMF",
    "tomli;python_version<'3.11'"
]

[project.urls]
Homepage = "https://github.com/ajdelguidice/python-as3lib"

[tool.setuptools]
packages = ["as3lib", "as3lib._toplevel", "as3lib.cfail", "as3lib.com", "as3lib.fl", "as3lib.flash", "as3lib.flash.text", "as3lib.tests", "as3lib.tests.flash"]
ext-modules = [
    {name = "as3lib.cmath", sources = ["sourcecode/cmath.c"]},
]

[tool.setuptools.dynamic]
version = {attr = "as3lib.as3state.__version__"}

[tool.tox]
requires = ["tox"]
env_list = ["py3", "py313", "py310"]

[tool.tox.env_run_base]
runner = "uv-venv-runner"
commands = [["python","-m","unittest","discover","as3lib/tests"]]

[tool.tox.env.py3]
deps = ["flake8"]
commands = [["-","flake8","--exclude","build,dist,configs,.tox,oldfiles","--ignore","E501,E226"]]
